
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19 to 20 | A Little Birthday Magic</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cream: #fff8ed;
  --pink: #f3b8c8;
  --rose: #c96883;
  --green: #365b49;
  --gold: #e9bd69;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(ellipse at top, #fffaf2, transparent 65%),
    linear-gradient(145deg, #f4e2d5, #f7eaf0, #dce8dc);
  color: var(--green);
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 16px;
  text-align: center;
}

.eyebrow {
  letter-spacing: 4px;
  text-transform: uppercase;
  font-size: 11px;
  color: #a46e78;
}

h1 {
  font-size: clamp(35px, 7vw, 62px);
  font-weight: normal;
  margin: 14px 0 8px;
}

.subtitle {
  max-width: 370px;
  line-height: 1.8;
  color: #7f716d;
  font-size: 15px;
  margin: 0 auto 20px;
}

.cake-scene {
  position: relative;
  width: min(350px, 95vw);
  height: 345px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin: 4px auto 15px;
}

.cake {
  width: 290px;
  height: 230px;
  position: relative;
  filter: drop-shadow(0 14px 12px #9a716b25);
}

.plate {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 290px;
  height: 23px;
  border-radius: 50%;
  background: linear-gradient(#fffdf9, #dfc9bc);
  border: 2px solid #fff9f0;
  box-shadow: 0 8px 0 #d2b5a8;
}

.bottom-layer {
  position: absolute;
  bottom: 19px;
  left: 12px;
  width: 266px;
  height: 85px;
  background: linear-gradient(90deg, #cf8394, #f4c6cf 45%, #db91a3);
  border-radius: 13px 13px 18px 18px;
  border-bottom: 10px solid #bb7084;
}

.bottom-icing {
  position: absolute;
  top: -8px;
  left: -2px;
  width: 270px;
  height: 22px;
  background: linear-gradient(#fffaf5, #f5e7e3);
  border-radius: 50%;
}

.drip {
  position: absolute;
  top: 5px;
  width: 17px;
  height: 26px;
  background: #f5e7e3;
  border-radius: 0 0 12px 12px;
}

.drip:nth-child(2) { left: 35px; height: 33px; }
.drip:nth-child(3) { left: 91px; height: 24px; }
.drip:nth-child(4) { left: 151px; height: 34px; }
.drip:nth-child(5) { left: 215px; height: 27px; }

.top-layer {
  position: absolute;
  bottom: 93px;
  left: 39px;
  width: 212px;
  height: 72px;
  background: linear-gradient(90deg, #e9c9a4, #ffedce 48%, #e4bd91);
  border-radius: 13px 13px 9px 9px;
  border-bottom: 8px solid #d4ab80;
}

.top-icing {
  position: absolute;
  top: -9px;
  left: 0;
  width: 212px;
  height: 22px;
  border-radius: 50%;
  background: #fff9ee;
}

.top-drip {
  position: absolute;
  top: 4px;
  width: 16px;
  height: 20px;
  background: #fff9ee;
  border-radius: 0 0 10px 10px;
}

.top-drip:nth-child(2) { left: 38px; height: 28px; }
.top-drip:nth-child(3) { left: 102px; height: 19px; }
.top-drip:nth-child(4) { left: 172px; height: 25px; }

.berry {
  position: absolute;
  top: -17px;
  width: 16px;
  height: 16px;
  background: #b84f68;
  border-radius: 50% 50% 45% 45%;
  box-shadow: inset -3px -3px 0 #8e3c50;
}

.berry::after {
  content: "✦";
  position: absolute;
  top: -6px;
  left: 3px;
  color: #577c4c;
  font-size: 10px;
}

.berry.one { left: 39px; }
.berry.two { left: 96px; top: -22px; }
.berry.three { left: 156px; }

.cake-number {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 111px;
  font-family: Georgia, serif;
  font-size: 49px;
  color: #87534c;
  text-shadow: 1px 2px 0 #fff5e3;
  transition: all 0.8s ease;
}

.cake-number.changed {
  color: #a34564;
  transform: scale(1.18);
}

.candle {
  position: absolute;
  width: 12px;
  height: 46px;
  left: 139px;
  bottom: 161px;
  background: repeating-linear-gradient(
    135deg, #fff6ed 0 6px, #d78da0 6px 11px
  );
  border-radius: 4px 4px 2px 2px;
  z-index: 4;
}

.wick {
  position: absolute;
  width: 2px;
  height: 8px;
  background: #49352d;
  top: -6px;
  left: 5px;
}

.flame {
  position: absolute;
  width: 17px;
  height: 25px;
  background: radial-gradient(ellipse at 50% 70%, #fff8bd 0 15%, #ffd45f 35%, #ff9745 70%, #ed6b42);
  border-radius: 50% 50% 45% 45%;
  top: -30px;
  left: -2px;
  transform: rotate(4deg);
  transform-origin: bottom center;
  filter: drop-shadow(0 0 9px #ffbb57);
  animation: flicker .8s infinite alternate ease-in-out;
  transition: opacity .4s, transform .4s;
}

.flame.off {
  opacity: 0;
  transform: scale(0) translateY(10px);
  animation: none;
}

.smoke {
  position: absolute;
  top: -40px;
  left: 1px;
  color: #aaa09b;
  font-size: 22px;
  opacity: 0;
}

.smoke.show {
  opacity: 1;
  animation: smoke 1.5s forwards;
}

@keyframes flicker {
  from { transform: rotate(-5deg) scale(.95); }
  to { transform: rotate(5deg) scale(1.07); }
}

@keyframes smoke {
  to { transform: translateY(-25px); opacity: 0; }
}

.cake-scene::before,
.cake-scene::after {
  content: "✦";
  position: absolute;
  color: #c69b55;
  font-size: 24px;
  animation: twinkle 2s infinite alternate;
}

.cake-scene::before {
  top: 100px;
  left: 20px;
}

.cake-scene::after {
  top: 60px;
  right: 20px;
  animation-delay: .8s;
}

@keyframes twinkle {
  from { opacity: .35; transform: scale(.8) rotate(0); }
  to { opacity: 1; transform: scale(1.25) rotate(20deg); }
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  max-width: 400px;
  margin: 8px auto;
}

button {
  font-family: inherit;
  font-size: 14px;
  padding: 13px 19px;
  border-radius: 30px;
  border: 1px solid #d9c1b6;
  background: #fffaf4;
  color: #65534c;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, background .2s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px #9b756525;
}

button.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
  transform: none;
}

.message {
  min-height: 88px;
  max-width: 380px;
  margin: 17px auto 0;
  padding: 18px 20px;
  border-top: 1px solid #d6b9a8;
  line-height: 1.8;
  color: #78675f;
  font-size: 15px;
}

.message strong {
  display: block;
  font-size: 22px;
  color: #a5526b;
  font-weight: normal;
  margin-bottom: 5px;
}

footer {
  margin-top: 10px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #9a8980;
}

.sparkle {
  position: fixed;
  top: -20px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 10;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
    opacity: 0;
  }
}

@media (max-width: 380px) {
  .cake-scene { transform: scale(.9); margin-top: -5px; margin-bottom: -5px; }
  h1 { font-size: 36px; }
}
</style>
</head>

<body>
<main class="page">

  <div class="eyebrow">A little piece of my story</div>

  <h1>Goodbye, nineteen.</h1>

  <p class="subtitle" id="subtitle">
    One little cake. Two different ages.
    A thousand memories in between.
  </p>

  <div class="cake-scene">
    <div class="cake">
      <div class="plate"></div>

      <div class="bottom-layer">
        <div class="bottom-icing">
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
        </div>
      </div>

      <div class="top-layer">
        <div class="top-icing">
          <div class="top-drip"></div>
          <div class="top-drip"></div>
          <div class="top-drip"></div>
          <div class="top-drip"></div>
        </div>
        <div class="berry one"></div>
        <div class="berry two"></div>
        <div class="berry three"></div>
      </div>

      <div class="cake-number" id="cakeNumber">19</div>

      <div class="candle">
        <div class="wick"></div>
        <div class="flame" id="flame"></div>
        <div class="smoke" id="smoke">〰</div>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="primary" id="turnButton">
       Turn 20
    </button>

    <button id="blowButton">
      🌬 Blow out the light
    </button>

<button id="memoryButton">
  🎁 The sweetest thing
</button>


  <div class="message" id="message" aria-live="polite">
    <strong>Before the next chapter...</strong>
    just know i will always be . Proud of you .
  </div>

  <footer>MADE WITH SACRIFICE · CHAPTER TWENTY</footer>

</main>

<script>
const cakeNumber = document.getElementById("cakeNumber");
const flame = document.getElementById("flame");
const smoke = document.getElementById("smoke");
const turnButton = document.getElementById("turnButton");
const blowButton = document.getElementById("blowButton");
const memoryButton = document.getElementById("memoryButton");
const message = document.getElementById("message");
const subtitle = document.getElementById("subtitle");

let isTwenty = false;
let isBlown = false;
let reminderIndex = 0;

const reminders = [
  {
    title: "Look how far you've come.",
    text: "You carried dreams through uncertain days. Give yourself credit for every small step."
  },
  {
    title: "You are allowed to begin again.",
    text: "Not every plan worked out. That doesn't mean your story stopped. You are still becoming."
  },
  {
    title: "Make these years count.",
    text: "Keep building, keep learning, keep dreaming. You don't need to have everything figured out today."
  },
  {
    title: "To the girl who kept going.",
    text: "May you always be proud of the girl you were, the woman you are, and the dreams you protect."
  }
];

turnButton.addEventListener("click", () => {
  if (!isTwenty) {
    isTwenty = true;

    cakeNumber.textContent = "20";
    cakeNumber.classList.add("changed");

    document.querySelector("h1").textContent = "Hello, twenty! ♡";
    subtitle.textContent =
      "Nineteen gave me memories. Twenty gets the girl who survived them.";

    message.innerHTML =
      "<strong>Welcome to chapter twenty.</strong>" +
      "I made these years count. And I'm only getting started.";

    turnButton.textContent = "✓ I turned 20";
    turnButton.disabled = true;

    celebration();
  }
});

blowButton.addEventListener("click", () => {
  if (!isBlown) {
    isBlown = true;
    flame.classList.add("off");
    smoke.classList.remove("show");

    // Restart the smoke animation.
    void smoke.offsetWidth;
    smoke.classList.add("show");

    blowButton.textContent = "♡ The light is out";
    message.innerHTML =
      "<strong>A wish, just for me.</strong>" +
      "May I never forget what I survived, what I built, and what I deserve.";
  } else {
    isBlown = false;
    flame.classList.remove("off");
    smoke.classList.remove("show");
    blowButton.textContent = "🌬 Blow out the light";

    message.innerHTML =
      "<strong>Let your light return.</strong>" +
      "Some dreams deserve to keep burning.";
  }
});


memoryButton.addEventListener("click", () => {
  message.innerHTML = `
    <strong>Well, well, look at us, girl. ♡</strong>

    We kept our promise, didn't we?

    We didn't let that 17-year-old version of us down.
    Look at us now... we really did it.
    Not perfectly, not without tears, but we DID IT.

    <br><br>

    <em>Ne kadar gurur duyduğumu bir bilsen...</em>

    <br><br>

    Et toi, ma belle...
    <em>Franchement, être toi, c'est presque de la triche.</em> 😉♡

    <br><br>

    <small>17 dreamed it. 19 fought for it. 20 gets to live it. ✨</small>
  `;
});


function celebration() {
  const symbols = ["✦", "♡", "✧", "❀", "✨"];

  for (let i = 0; i < 55; i++) {
    const sparkle = document.createElement("span");

    sparkle.className = "sparkle";
    sparkle.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.fontSize = (12 + Math.random() * 16) + "px";
    sparkle.style.animationDuration = (2 + Math.random() * 4) + "s";
    sparkle.style.animationDelay = Math.random() * 1.5 + "s";

    document.body.appendChild(sparkle);

    sparkle.addEventListener("animationend", () => {
      sparkle.remove();
    });
  }
}
</script>

</body>
</html>
